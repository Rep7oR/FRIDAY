<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="scanlines"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">J.A.R.V.I.S.</span>
  </div>
  <div class="operator" id="operator">operator: --</div>
  <div class="status" id="status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">connecting&hellip;</span>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main class="layout">
  <aside class="panel panel-left">
    <div class="widget">
      <div class="widget-title">CPU</div>
      <div class="widget-value" id="cpu-value">--%</div>
      <canvas class="sparkline" id="cpu-spark" width="220" height="44"></canvas>
    </div>
    <div class="widget">
      <div class="widget-title">Memory</div>
      <div class="widget-value" id="mem-value">--%</div>
      <div class="widget-sub" id="mem-sub">-- / -- GB</div>
      <canvas class="sparkline" id="mem-spark" width="220" height="44"></canvas>
    </div>
    <div class="widget">
      <div class="widget-title">Disk</div>
      <div class="widget-value" id="disk-value">--%</div>
      <div class="widget-sub" id="disk-sub">-- / -- GB</div>
      <div class="bar-gauge"><div class="bar-gauge-fill" id="disk-gauge"></div></div>
    </div>
    <div class="widget">
      <div class="widget-title">Network</div>
      <div class="widget-sub" id="net-sub">&uarr; -- KB/s &nbsp; &darr; -- KB/s</div>
      <canvas class="sparkline" id="net-spark" width="220" height="44"></canvas>
    </div>
    <div class="widget">
      <div class="widget-title">Uptime</div>
      <div class="widget-value widget-value-sm" id="uptime-value">--</div>
    </div>
  </aside>

  <section class="core-stage">
    <div class="core" id="core">
      <svg class="tick-ring" viewBox="0 0 300 300"></svg>
      <div class="ring ring-outer"></div>
      <div class="ring ring-mid"></div>
      <div class="ring ring-inner"></div>
      <div class="core-glow"></div>
      <div class="reactor">
        <svg class="reactor-svg" viewBox="0 0 100 100">
          <polygon class="reactor-tri reactor-tri-1" points="50,6 6,90 94,90" />
          <polygon class="reactor-tri reactor-tri-2" points="50,6 6,90 94,90" />
          <polygon class="reactor-tri reactor-tri-3" points="50,6 6,90 94,90" />
        </svg>
        <div class="reactor-core"></div>
      </div>
      <div class="orbit orbit-1"><span class="orbit-dot"></span></div>
      <div class="orbit orbit-2"><span class="orbit-dot"></span></div>
    </div>
    <div class="waveform" id="waveform"></div>
    <div class="core-state" id="core-state">IDLE</div>
  </section>

  <aside class="panel panel-right">
    <div class="widget widget-weather">
      <div class="widget-title">Weather</div>
      <div class="weather-body" id="weather-body">Requesting location&hellip;</div>
    </div>
    <div class="widget widget-clock-big">
      <div class="widget-title">Local Time</div>
      <div class="big-clock" id="big-clock">--:--:--</div>
      <div class="big-date" id="big-date">----</div>
    </div>
    <div class="widget widget-reminders">
      <div class="widget-title">Reminders</div>
      <ul id="reminders-list" class="reminders-list">
        <li class="muted">none yet</li>
      </ul>
    </div>
    <div class="widget widget-log">
      <div class="widget-title">Log</div>
      <div id="chat-log" class="chat-log"></div>
    </div>
  </aside>
</main>

<footer class="composer">
  <button id="wake-btn" class="icon-btn" title="Toggle 'Hey Jarvis' always-listening mode">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v10a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5zm7 9v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V24h2v-2.06A9 9 0 0 0 21 13v-2h-2z"/></svg>
  </button>
  <button id="mic-btn" class="icon-btn" title="Speak (voice input)">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <input id="text-input" type="text" placeholder="Ask Jarvis anything..." autocomplete="off" />
  <button id="send-btn" class="icon-btn" title="Send">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
  <button id="voice-toggle" class="icon-btn toggle-on" title="Toggle spoken replies">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 15 8.29v7.42A4.5 4.5 0 0 0 16.5 12z"/></svg>
  </button>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
