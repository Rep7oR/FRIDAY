<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>JARVIS — Knowledge Galaxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  #graph {
    position: absolute;
    inset: 0;
  }
  #starfield {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  #title-bar {
    position: absolute;
    top: 18px;
    left: 24px;
    color: #d7e6ff;
    z-index: 5;
    text-shadow: 0 0 12px rgba(80, 160, 255, 0.6);
    pointer-events: none;
  }
  #title-bar h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 3px;
    font-weight: 300;
  }
  #title-bar p {
    margin: 4px 0 0;
    font-size: 12px;
    color: #7fa7d8;
    letter-spacing: 1px;
  }
  #panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 340px;
    max-width: 90vw;
    height: 100%;
    background: rgba(6, 12, 24, 0.88);
    border-left: 1px solid rgba(100, 170, 255, 0.35);
    box-shadow: -20px 0 60px rgba(0, 0, 0, 0.6);
    color: #e4eefc;
    transform: translateX(100%);
    transition: transform 0.35s ease;
    z-index: 10;
    padding: 28px 22px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #panel.open {
    transform: translateX(0);
  }
  #panel .group-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8fd3ff;
    border: 1px solid rgba(143, 211, 255, 0.4);
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 14px;
  }
  #panel h2 {
    margin: 0 0 6px;
    font-weight: 400;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 16px rgba(80, 160, 255, 0.5);
  }
  #panel .excerpt {
    font-size: 14px;
    line-height: 1.6;
    color: #c4d6ef;
    white-space: pre-wrap;
  }
  #panel .close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    background: none;
    border: none;
    color: #8fd3ff;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  #legend {
    position: absolute;
    bottom: 20px;
    left: 24px;
    z-index: 5;
    color: #cfe0f7;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #legend .item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #legend .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
</style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="graph"></div>

  <div id="title-bar">
    <h1>J A R V I S</h1>
    <p id="node-count">knowledge galaxy — loading…</p>
  </div>

  <div id="legend"></div>

  <div id="panel">
    <button class="close-btn" onclick="closePanel()">&times;</button>
    <div class="group-tag" id="panel-group">—</div>
    <h2 id="panel-title">—</h2>
    <div class="excerpt" id="panel-excerpt">—</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script src="graph-data.js"></script>
  <script>
    // ---------- starfield background ----------
    (function starfield() {
      const canvas = document.getElementById("starfield");
      const ctx = canvas.getContext("2d");
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = Math.floor((canvas.width * canvas.height) / 3200);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.3 + 0.2,
          twinkle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.015 + 0.005,
        }));
      }

      function draw() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          s.twinkle += s.speed;
          const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
          ctx.beginPath();
          ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw();
    })();

    // ---------- color by group ----------
    const GROUP_COLORS = [
      "#4fd1ff", "#ff6ec7", "#ffd166", "#8affc1",
      "#c792ff", "#ff8c5a", "#6ee7e7", "#f2f2f2",
    ];
    const groupColorMap = {};
    function colorForGroup(group) {
      if (!(group in groupColorMap)) {
        const idx = Object.keys(groupColorMap).length % GROUP_COLORS.length;
        groupColorMap[group] = GROUP_COLORS[idx];
      }
      return groupColorMap[group];
    }

    document.getElementById("node-count").textContent =
      `${GRAPH.nodes.length} notes indexed · ${GRAPH.links.length} connections`;

    // pre-assign colors so legend order is stable
    [...new Set(GRAPH.nodes.map((n) => n.group))].sort().forEach(colorForGroup);

    const legendEl = document.getElementById("legend");
    Object.entries(groupColorMap).forEach(([group, color]) => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `<span class="swatch" style="color:${color}; background:${color}"></span>${group}`;
      legendEl.appendChild(item);
    });

    // ---------- graph ----------
    const highlightNodes = new Set();
    const highlightLinks = new Set();
    let hoverNode = null;

    const Graph = ForceGraph3D()(document.getElementById("graph"))
      .backgroundColor("rgba(0,0,0,0)")
      .graphData(JSON.parse(JSON.stringify(GRAPH)))
      .nodeLabel((n) => `${n.label} · ${n.group}`)
      .nodeColor((n) =>
        highlightNodes.has(n.id) || highlightNodes.size === 0
          ? colorForGroup(n.group)
          : "rgba(120,140,170,0.25)"
      )
      .nodeVal((n) => (highlightNodes.has(n.id) ? 10 : 5))
      .nodeOpacity(0.95)
      .nodeResolution(16)
      .linkColor((l) => (highlightLinks.has(l) ? "#ffffff" : "rgba(120,160,220,0.25)"))
      .linkWidth((l) => (highlightLinks.has(l) ? 1.6 : 0.4))
      .linkDirectionalParticles((l) => (highlightLinks.has(l) ? 3 : 0))
      .linkDirectionalParticleWidth(1.6)
      .onNodeClick(handleNodeClick)
      .onBackgroundClick(closePanel);

    Graph.d3Force("charge").strength(-140);

    // slow idle drift: gently orbit the camera when nothing is happening
    let idleAngle = 0;
    let lastInteraction = Date.now();
    Graph.controls().addEventListener("start", () => (lastInteraction = Date.now()));

    (function idleDrift() {
      requestAnimationFrame(idleDrift);
      if (Date.now() - lastInteraction < 4000) return;
      idleAngle += 0.0006;
      const distance = 420;
      Graph.cameraPosition({
        x: distance * Math.sin(idleAngle),
        z: distance * Math.cos(idleAngle),
      });
    })();

    function getNeighbors(nodeId) {
      const neighborIds = new Set([nodeId]);
      const links = [];
      GRAPH.links.forEach((l) => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        if (s === nodeId || t === nodeId) {
          neighborIds.add(s);
          neighborIds.add(t);
          links.push(l);
        }
      });
      return { neighborIds, links };
    }

    function handleNodeClick(node) {
      lastInteraction = Date.now();
      const { neighborIds, links } = getNeighbors(node.id);
      highlightNodes.clear();
      highlightLinks.clear();
      neighborIds.forEach((id) => highlightNodes.add(id));
      links.forEach((l) => highlightLinks.add(l));

      const distance = 90;
      const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
      Graph.cameraPosition(
        { x: (node.x || 0.1) * distRatio, y: (node.y || 0.1) * distRatio, z: (node.z || 0.1) * distRatio },
        node,
        1000
      );

      openPanel(node);
      Graph.refresh();
    }

    function openPanel(node) {
      document.getElementById("panel-group").textContent = node.group;
      document.getElementById("panel-title").textContent = node.label;
      document.getElementById("panel-excerpt").textContent = node.excerpt;
      document.getElementById("panel").classList.add("open");
    }

    function closePanel() {
      document.getElementById("panel").classList.remove("open");
      highlightNodes.clear();
      highlightLinks.clear();
      Graph.refresh();
    }

    window.__jarvisGraph = Graph; // exposed for later prompts (chat -> fly-to-source, remember, etc.)
    window.__jarvisGetNeighbors = getNeighbors;
    window.__jarvisHandleNodeClick = handleNodeClick;
  </script>
</body>
</html>
