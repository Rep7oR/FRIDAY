<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>JARVIS — Knowledge Galaxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  #graph {
    position: absolute;
    inset: 0;
  }
  #starfield {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  #title-bar {
    position: absolute;
    top: 18px;
    left: 24px;
    color: #d7e6ff;
    z-index: 5;
    text-shadow: 0 0 12px rgba(80, 160, 255, 0.6);
    pointer-events: none;
  }
  #title-bar h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 3px;
    font-weight: 300;
  }
  #title-bar p {
    margin: 4px 0 0;
    font-size: 12px;
    color: #7fa7d8;
    letter-spacing: 1px;
  }

  /* ---------- JARVIS HUD logo (top-right, animates with state) ---------- */
  #jarvis-hud {
    position: absolute;
    top: 22px;
    right: 28px;
    width: 128px;
    height: 128px;
    z-index: 6;
    cursor: pointer;
    filter: drop-shadow(0 0 14px rgba(60, 170, 255, 0.35));
    transition: opacity 0.3s, filter 0.3s;
  }
  #jarvis-hud.muted {
    opacity: 0.35;
    filter: grayscale(1);
  }
  #jarvis-hud .hud-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-sizing: border-box;
  }
  #jarvis-hud .ring-outer {
    border: 1.5px dashed rgba(79, 209, 255, 0.55);
    animation: hud-spin 18s linear infinite;
  }
  #jarvis-hud .ring-ticks {
    inset: 10px;
    background: repeating-conic-gradient(
      rgba(120, 210, 255, 0.9) 0deg 2deg,
      transparent 2deg 11.25deg
    );
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
    animation: hud-spin-reverse 26s linear infinite;
  }
  #jarvis-hud .ring-inner {
    inset: 24px;
    border: 1px solid rgba(143, 211, 255, 0.5);
    animation: hud-spin 12s linear infinite;
  }
  #jarvis-hud .hud-core {
    position: absolute;
    inset: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, rgba(20, 60, 100, 0.9), rgba(4, 10, 20, 0.95));
    border: 1px solid rgba(143, 211, 255, 0.55);
    box-shadow: 0 0 18px rgba(60, 170, 255, 0.35) inset, 0 0 10px rgba(60, 170, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: hud-pulse 3.6s ease-in-out infinite;
  }
  #jarvis-hud .hud-core span {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #cfeaff;
    text-shadow: 0 0 8px rgba(90, 190, 255, 0.8);
  }

  @keyframes hud-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes hud-spin-reverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes hud-pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(60, 170, 255, 0.35) inset, 0 0 10px rgba(60, 170, 255, 0.3); }
    50% { box-shadow: 0 0 26px rgba(90, 200, 255, 0.55) inset, 0 0 18px rgba(90, 200, 255, 0.5); }
  }

  /* active states speed up / brighten the rings — driven by JS via class swap */
  #jarvis-hud.state-listening .ring-outer,
  #jarvis-hud.state-thinking .ring-outer,
  #jarvis-hud.state-speaking .ring-outer {
    animation-duration: 4s;
  }
  #jarvis-hud.state-listening .ring-ticks,
  #jarvis-hud.state-thinking .ring-ticks,
  #jarvis-hud.state-speaking .ring-ticks {
    animation-duration: 6s;
  }
  #jarvis-hud.state-listening .ring-inner,
  #jarvis-hud.state-thinking .ring-inner,
  #jarvis-hud.state-speaking .ring-inner {
    animation-duration: 2.5s;
  }
  #jarvis-hud.state-listening .hud-core {
    animation: hud-pulse 1s ease-in-out infinite;
  }
  #jarvis-hud.state-listening {
    filter: drop-shadow(0 0 20px rgba(255, 90, 122, 0.5));
  }
  #jarvis-hud.state-listening .hud-ring.ring-ticks {
    background: repeating-conic-gradient(rgba(255, 120, 150, 0.9) 0deg 2deg, transparent 2deg 11.25deg);
  }
  #jarvis-hud.state-thinking .hud-core {
    animation: hud-pulse 0.8s ease-in-out infinite;
  }
  #jarvis-hud.state-thinking {
    filter: drop-shadow(0 0 20px rgba(255, 200, 90, 0.5));
  }
  #jarvis-hud.state-thinking .hud-ring.ring-ticks {
    background: repeating-conic-gradient(rgba(255, 210, 120, 0.9) 0deg 2deg, transparent 2deg 11.25deg);
  }
  #jarvis-hud.state-speaking .hud-core {
    animation: hud-pulse 0.6s ease-in-out infinite;
  }
  #jarvis-hud.state-speaking {
    filter: drop-shadow(0 0 22px rgba(90, 230, 255, 0.6));
  }

  #panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 340px;
    max-width: 90vw;
    height: 100%;
    background: rgba(6, 12, 24, 0.88);
    border-left: 1px solid rgba(100, 170, 255, 0.35);
    box-shadow: -20px 0 60px rgba(0, 0, 0, 0.6);
    color: #e4eefc;
    transform: translateX(100%);
    transition: transform 0.35s ease;
    z-index: 10;
    padding: 28px 22px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  #panel.open {
    transform: translateX(0);
  }
  #panel .group-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8fd3ff;
    border: 1px solid rgba(143, 211, 255, 0.4);
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 14px;
  }
  #panel h2 {
    margin: 0 0 6px;
    font-weight: 400;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 16px rgba(80, 160, 255, 0.5);
  }
  #panel .excerpt {
    font-size: 14px;
    line-height: 1.6;
    color: #c4d6ef;
    white-space: pre-wrap;
  }
  #panel .close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    background: none;
    border: none;
    color: #8fd3ff;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  #legend {
    position: absolute;
    bottom: 20px;
    left: 24px;
    z-index: 5;
    color: #cfe0f7;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #legend .item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #legend .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }

  #chat-dock {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px, calc(100vw - 48px));
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
  }
  #answer-box {
    display: none;
    background: rgba(6, 14, 26, 0.85);
    border: 1px solid rgba(100, 170, 255, 0.3);
    border-radius: 14px;
    padding: 14px 18px;
    color: #e4eefc;
    font-size: 14px;
    line-height: 1.55;
    max-height: 180px;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  #answer-box.visible {
    display: block;
  }
  #chat-form {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(8, 16, 30, 0.85);
    border: 1px solid rgba(100, 170, 255, 0.35);
    border-radius: 999px;
    padding: 6px 8px 6px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
  }
  #chat-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #eaf2ff;
    font-size: 14px;
    padding: 8px 0;
  }
  #chat-input::placeholder {
    color: #5d7ea6;
  }
  #chat-send {
    background: linear-gradient(135deg, #4fd1ff, #7f9fff);
    border: none;
    color: #051018;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  #chat-send:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #mic-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(100, 170, 255, 0.4);
    background: rgba(20, 34, 56, 0.8);
    color: #8fd3ff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s, background 0.2s;
  }
  #mic-btn:hover {
    background: rgba(30, 50, 78, 0.9);
  }
  #mic-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  #mic-btn.listening {
    background: #ff5a7a;
    color: #fff;
    box-shadow: 0 0 0 0 rgba(255, 90, 122, 0.6);
    animation: mic-pulse 1.4s ease-out infinite;
  }
  @keyframes mic-pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 90, 122, 0.55); }
    70% { box-shadow: 0 0 0 14px rgba(255, 90, 122, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 90, 122, 0); }
  }
  #chat-status {
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: #7fa7d8;
    min-height: 14px;
  }
</style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="graph"></div>

  <div id="title-bar">
    <h1>J A R V I S</h1>
    <p id="node-count">knowledge galaxy — loading…</p>
  </div>

  <div id="jarvis-hud" class="state-idle" title="Click to mute/unmute wake-word listening">
    <div class="hud-ring ring-outer"></div>
    <div class="hud-ring ring-ticks"></div>
    <div class="hud-ring ring-inner"></div>
    <div class="hud-core"><span>J.A.R.V.I.S</span></div>
  </div>

  <div id="legend"></div>

  <div id="panel">
    <button class="close-btn" onclick="closePanel()">&times;</button>
    <div class="group-tag" id="panel-group">—</div>
    <h2 id="panel-title">—</h2>
    <div class="excerpt" id="panel-excerpt">—</div>
  </div>

  <div id="chat-dock">
    <div id="answer-box"></div>
    <div id="chat-status"></div>
    <form id="chat-form">
      <button id="mic-btn" type="button" title="Click and speak">🎙</button>
      <input id="chat-input" type="text" autocomplete="off" placeholder="Ask something about your notes…" />
      <button id="chat-send" type="submit">Ask</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script src="graph-data.js"></script>
  <script>
    // ---------- starfield background ----------
    (function starfield() {
      const canvas = document.getElementById("starfield");
      const ctx = canvas.getContext("2d");
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = Math.floor((canvas.width * canvas.height) / 3200);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.3 + 0.2,
          twinkle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.015 + 0.005,
        }));
      }

      function draw() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          s.twinkle += s.speed;
          const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
          ctx.beginPath();
          ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw();
    })();

    // ---------- color by group ----------
    const GROUP_COLORS = [
      "#4fd1ff", "#ff6ec7", "#ffd166", "#8affc1",
      "#c792ff", "#ff8c5a", "#6ee7e7", "#f2f2f2",
    ];
    const groupColorMap = {};
    function colorForGroup(group) {
      if (!(group in groupColorMap)) {
        const idx = Object.keys(groupColorMap).length % GROUP_COLORS.length;
        groupColorMap[group] = GROUP_COLORS[idx];
      }
      return groupColorMap[group];
    }

    document.getElementById("node-count").textContent =
      `${GRAPH.nodes.length} notes indexed · ${GRAPH.links.length} connections`;

    // pre-assign colors so legend order is stable
    [...new Set(GRAPH.nodes.map((n) => n.group))].sort().forEach(colorForGroup);

    const legendEl = document.getElementById("legend");
    Object.entries(groupColorMap).forEach(([group, color]) => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `<span class="swatch" style="color:${color}; background:${color}"></span>${group}`;
      legendEl.appendChild(item);
    });

    // ---------- graph ----------
    const highlightNodes = new Set();
    const highlightLinks = new Set();
    let hoverNode = null;

    const Graph = ForceGraph3D()(document.getElementById("graph"))
      .backgroundColor("rgba(0,0,0,0)")
      .graphData(JSON.parse(JSON.stringify(GRAPH)))
      .nodeLabel((n) => `${n.label} · ${n.group}`)
      .nodeColor((n) =>
        highlightNodes.has(n.id) || highlightNodes.size === 0
          ? colorForGroup(n.group)
          : "rgba(120,140,170,0.25)"
      )
      .nodeVal((n) => (highlightNodes.has(n.id) ? 10 : 5))
      .nodeOpacity(0.95)
      .nodeResolution(16)
      .linkColor((l) => (highlightLinks.has(l) ? "#ffffff" : "rgba(120,160,220,0.25)"))
      .linkWidth((l) => (highlightLinks.has(l) ? 1.6 : 0.4))
      .linkDirectionalParticles((l) => (highlightLinks.has(l) ? 3 : 0))
      .linkDirectionalParticleWidth(1.6)
      .onNodeClick(handleNodeClick)
      .onBackgroundClick(closePanel);

    Graph.d3Force("charge").strength(-140);

    // slow idle drift: gently orbit the camera when nothing is happening
    let idleAngle = 0;
    let lastInteraction = Date.now();
    Graph.controls().addEventListener("start", () => (lastInteraction = Date.now()));

    (function idleDrift() {
      requestAnimationFrame(idleDrift);
      if (Date.now() - lastInteraction < 4000) return;
      idleAngle += 0.0006;
      const distance = 420;
      Graph.cameraPosition({
        x: distance * Math.sin(idleAngle),
        z: distance * Math.cos(idleAngle),
      });
    })();

    function getNeighbors(nodeId) {
      const neighborIds = new Set([nodeId]);
      const links = [];
      GRAPH.links.forEach((l) => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        if (s === nodeId || t === nodeId) {
          neighborIds.add(s);
          neighborIds.add(t);
          links.push(l);
        }
      });
      return { neighborIds, links };
    }

    function internalNode(nodeId) {
      return Graph.graphData().nodes.find((n) => n.id === nodeId);
    }

    function flyCameraTo(node, distance = 90) {
      const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
      Graph.cameraPosition(
        { x: (node.x || 0.1) * distRatio, y: (node.y || 0.1) * distRatio, z: (node.z || 0.1) * distRatio },
        node,
        1000
      );
    }

    function handleNodeClick(node) {
      lastInteraction = Date.now();
      const { neighborIds, links } = getNeighbors(node.id);
      highlightNodes.clear();
      highlightLinks.clear();
      neighborIds.forEach((id) => highlightNodes.add(id));
      links.forEach((l) => highlightLinks.add(l));

      flyCameraTo(node);
      openPanel(node);
      Graph.refresh();
    }

    // Prompt 4 — fly-to-source: the camera proves where a /chat answer came
    // from. A single/small source set flies to (and highlights the neighbors
    // of) the top note; 4+ sources light up the whole cluster instead.
    function revealAnswerSources(nodeIds) {
      lastInteraction = Date.now();
      if (!nodeIds || nodeIds.length === 0) return;

      highlightNodes.clear();
      highlightLinks.clear();

      if (nodeIds.length >= 4) {
        nodeIds.forEach((id) => highlightNodes.add(id));
        GRAPH.links.forEach((l) => {
          const s = typeof l.source === "object" ? l.source.id : l.source;
          const t = typeof l.target === "object" ? l.target.id : l.target;
          if (highlightNodes.has(s) && highlightNodes.has(t)) highlightLinks.add(l);
        });
        Graph.zoomToFit(1000, 120, (n) => highlightNodes.has(n.id));

        const topNode = internalNode(nodeIds[0]);
        if (topNode) openPanel(topNode);
      } else {
        const topId = nodeIds[0];
        const { neighborIds, links } = getNeighbors(topId);
        neighborIds.forEach((id) => highlightNodes.add(id));
        links.forEach((l) => highlightLinks.add(l));

        const topNode = internalNode(topId);
        if (topNode) {
          flyCameraTo(topNode);
          openPanel(topNode);
        }
      }

      Graph.refresh();
    }

    function openPanel(node) {
      document.getElementById("panel-group").textContent = node.group;
      document.getElementById("panel-title").textContent = node.label;
      document.getElementById("panel-excerpt").textContent = node.excerpt;
      document.getElementById("panel").classList.add("open");
    }

    function closePanel() {
      document.getElementById("panel").classList.remove("open");
      highlightNodes.clear();
      highlightLinks.clear();
      Graph.refresh();
    }

    window.__jarvisGraph = Graph; // exposed for later prompts (chat -> fly-to-source, remember, etc.)
    window.__jarvisGetNeighbors = getNeighbors;
    window.__jarvisHandleNodeClick = handleNodeClick;

    // ---------- chat ----------
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");
    const chatStatus = document.getElementById("chat-status");
    const answerBox = document.getElementById("answer-box");
    const micBtn = document.getElementById("mic-btn");
    const hudEl = document.getElementById("jarvis-hud");

    function setStatus(text) {
      chatStatus.textContent = text;
    }

    function showAnswer(text) {
      answerBox.textContent = text;
      answerBox.classList.add("visible");
    }

    // ---------- HUD state (idle / listening / thinking / speaking) ----------
    function setJarvisState(state) {
      hudEl.classList.remove("state-idle", "state-listening", "state-thinking", "state-speaking");
      hudEl.classList.add(`state-${state}`);
    }

    // ---------- speech output (speak every answer aloud) ----------
    let audioUnlocked = false;
    let britishVoice = null;

    function pickBritishVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return (
        voices.find((v) => v.lang === "en-GB" && /female/i.test(v.name)) ||
        voices.find((v) => v.lang === "en-GB") ||
        voices.find((v) => /British|UK English/i.test(v.name)) ||
        null
      );
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        britishVoice = pickBritishVoice();
      };
      britishVoice = pickBritishVoice();
    }

    function unlockAudio() {
      startWakeListening();
      if (audioUnlocked || !("speechSynthesis" in window)) return;
      audioUnlocked = true;
      // Speak an empty/silent utterance so the browser's autoplay gate opens
      // now, while this is still inside a user-gesture call stack.
      const warmup = new SpeechSynthesisUtterance(" ");
      warmup.volume = 0;
      window.speechSynthesis.speak(warmup);
    }
    document.body.addEventListener("click", unlockAudio, { once: true });

    function speak(text) {
      if (!("speechSynthesis" in window) || !text) return;
      pauseWakeListening();
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if (britishVoice) utter.voice = britishVoice;
      utter.lang = britishVoice ? britishVoice.lang : "en-GB";
      utter.rate = 1;
      setJarvisState("speaking");
      utter.onend = () => {
        setJarvisState("idle");
        resumeWakeListening();
      };
      utter.onerror = () => {
        setJarvisState("idle");
        resumeWakeListening();
      };
      window.speechSynthesis.speak(utter);
    }

    async function askJarvis(question) {
      chatSend.disabled = true;
      setStatus("● thinking…");
      setJarvisState("thinking");
      pauseWakeListening();
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ message: question }),
        });
        const data = await res.json();
        const answer = data.answer || "(no answer)";
        showAnswer(answer);
        speak(answer); // moves HUD to "speaking", then back to "idle" + resumes wake listening
        revealAnswerSources(data.nodes);
        setStatus("");
        return data;
      } catch (err) {
        const failMsg = "Couldn't reach the server. Is server.py running?";
        showAnswer(failMsg);
        speak(failMsg);
        setStatus("");
      } finally {
        chatSend.disabled = false;
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const question = chatInput.value.trim();
      if (!question) return;
      chatInput.value = "";
      askJarvis(question);
    });

    // ---------- speech input (mic button) ----------
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;

    if (SpeechRecognitionImpl) {
      recognition = new SpeechRecognitionImpl();
      recognition.lang = "en-GB";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add("listening");
        setStatus("● listening…");
        pauseWakeListening();
        setJarvisState("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          chatInput.value = "";
          askJarvis(transcript);
        }
      };

      recognition.onerror = (event) => {
        setStatus("");
        setJarvisState("idle");
        resumeWakeListening();
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          showAnswer("Microphone blocked — allow it via the lock icon in the address bar.");
        }
      };

      recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("listening");
        if (chatStatus.textContent === "● listening…") setStatus("");
      };

      micBtn.addEventListener("click", () => {
        unlockAudio();
        if (listening) {
          recognition.stop();
          return;
        }
        try {
          recognition.start();
        } catch (err) {
          // start() throws if called twice in a row; ignore.
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.title = "Speech recognition needs Chrome or Edge";
    }

    // ---------- Prompt 5-ish: wake word + casual assistant behavior ----------
    // Always-listening background recognizer for "jarvis" / "hey jarvis" /
    // "hello jarvis". Separate from the push-to-talk `recognition` above —
    // only one SpeechRecognition session can run at a time in Chrome, so
    // this pauses whenever the mic button is used or Jarvis is speaking,
    // and resumes automatically afterwards.
    let wakeRecognition = null;
    let wakeEnabled = true; // toggled by clicking the HUD
    let wakeActive = false;
    let awaitingFollowUp = false;
    let followUpTimer = null;

    const GREETING_ACKS = [
      "Yes, sir?",
      "I'm listening.",
      "Go ahead.",
      "At your service, sir.",
      "How can I help?",
      "Right here, sir.",
    ];

    function randomAck(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function startWakeListening() {
      if (!SpeechRecognitionImpl || !wakeEnabled || wakeActive || listening) return;
      wakeRecognition = new SpeechRecognitionImpl();
      wakeRecognition.lang = "en-GB";
      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = false;

      wakeRecognition.onstart = () => {
        wakeActive = true;
      };
      wakeRecognition.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        handleAmbientTranscript((last[0].transcript || "").trim());
      };
      wakeRecognition.onerror = () => {
        // "no-speech" / "aborted" are routine in always-on mode — ignore quietly.
      };
      wakeRecognition.onend = () => {
        wakeActive = false;
        if (wakeEnabled) setTimeout(startWakeListening, 300);
      };

      try {
        wakeRecognition.start();
      } catch (err) {
        // already starting; ignore.
      }
    }

    function pauseWakeListening() {
      if (wakeRecognition) {
        wakeRecognition.onend = null; // don't auto-restart from a deliberate pause
        try {
          wakeRecognition.stop();
        } catch (err) {
          // ignore
        }
      }
      wakeActive = false;
    }

    function resumeWakeListening() {
      if (wakeEnabled) startWakeListening();
    }

    function handleAmbientTranscript(transcript) {
      if (!transcript) return;
      const hasWake = /\bjarvis\b/i.test(transcript);

      if (hasWake) {
        const command = transcript.replace(/^.*?\bjarvis\b[,:]?\s*/i, "").trim();
        wakeUp(command);
      } else if (awaitingFollowUp) {
        wakeUp(transcript);
      }
      // otherwise: not addressed to Jarvis — ignore ambient chatter.
    }

    function wakeUp(command) {
      clearTimeout(followUpTimer);
      awaitingFollowUp = false;

      const isBareGreeting = command.length === 0 || /^(hi|hey|hello|yo|there)[.!?,]*$/i.test(command);

      if (isBareGreeting) {
        const ack = randomAck(GREETING_ACKS);
        showAnswer(ack);
        speak(ack);
        awaitingFollowUp = true;
        followUpTimer = setTimeout(() => {
          awaitingFollowUp = false;
        }, 8000);
      } else {
        chatInput.value = "";
        askJarvis(command);
      }
    }

    if (SpeechRecognitionImpl) {
      hudEl.addEventListener("click", () => {
        unlockAudio();
        wakeEnabled = !wakeEnabled;
        hudEl.classList.toggle("muted", !wakeEnabled);
        if (wakeEnabled) {
          resumeWakeListening();
        } else {
          pauseWakeListening();
        }
      });
    } else {
      hudEl.title = "Wake-word listening needs Chrome or Edge";
    }

    window.__jarvisAsk = askJarvis;
    window.__jarvisSpeak = speak;
    window.__jarvisSetState = setJarvisState;
  </script>
</body>
</html>
